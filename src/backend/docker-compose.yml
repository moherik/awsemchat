services:
  db:
    image: postgres:16-alpine
    container_name: awsemchat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: awsemchat_dev
    ports:
      - "5433:5432"
    volumes:
      - awsemchat-pgdata:/var/lib/postgresql/data
volumes:
  awsemchat-pgdata:
