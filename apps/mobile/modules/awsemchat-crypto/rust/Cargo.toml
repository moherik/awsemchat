[package]
name = "awsemchat-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
sha2 = "=0.11.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[profile.release]
panic = "abort"
strip = true
